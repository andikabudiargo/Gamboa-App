<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Journal</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

  <!-- Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[url('bg-2.png')] bg-cover bg-center">
    <!-- Header -->
   <header class="flex items-center justify-between px-6 py-4 backdrop-blur-md bg-white/10 border-b border-white/20">
  <div class="flex items-center gap-3">
    <h1 class="text-gray-600 text-xl font-semibold tracking-wide">
      Gamboa Art
    </h1>
  </div>

  <!-- Theme Toggle -->
  <button
    onclick="toggleTheme()"
    class="w-10 h-10 flex items-center justify-center
           rounded-full bg-gray-100 hover:bg-pink/30
           transition"
  >
    <i id="themeIcon" class="fa-solid fa-moon text-gray-900"></i>
  </button>
</header>

    <!-- Main Content -->
<main class="max-w-3xl mx-auto px-6 py-10 text-left">

  <!-- Greeting -->
  <div class="mb-6">
    <h1 class="text-lg font-bold text-gray-900 leading-snug">
      Halo, Fredelida Gamboa Masela 🌱
    </h1>
    <p class="text-gray-600 text-sm mt-2">
      Mau cari materi apa hari ini?
    </p>
  </div>

  <!-- Cute Search -->
  <div class="relative">
    <input
      type="text"
      placeholder="Misal: Kelas Warna Lanjutan. . ."
      class="w-full rounded-full px-5 py-3 pr-12
             bg-white/80 backdrop-blur border border-pink-500
             shadow focus:outline-none focus:ring-2 focus:ring-pink/20
             placeholder:text-gray-400"
    />

    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xl">
      🐣
    </span>
  </div>
<div class="mt-8">
  <p class="text-gray-600 text-sm">
    List Kelas
  </p>
  <div class="w-full mt-2 border-b-2 border-gray-900"></div>
</div>

<div class="grid grid-cols-2 gap-4 mt-5">

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <img
      src="kelas-warna.jpg"
      class="w-full h-28 object-cover"
      alt="Kelas Warna"
    >
    <div class="p-3">
      <h3 class="text-sm font-semibold text-gray-900 leading-tight">
        Kelas Warna
      </h3>
      <p class="text-xs text-gray-500 mt-1">
        by Ilustrasee
      </p>
    </div>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <img
      src="ilustrasi-cerita-anak-intensif.jpg"
      class="w-full h-28 object-cover"
      alt="Kelas"
    >
    <div class="p-3">
      <h3 class="text-sm font-semibold text-gray-900 leading-tight">
        Ilustrasi Cerita Anak Intensif
      </h3>
      <p class="text-xs text-gray-500 mt-1">
        by Ilustrasee
      </p>
    </div>
  </div>
  
    <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <img
      src="explore-character.jpg"
      class="w-full h-28 object-cover"
      alt="Kelas"
    >
    <div class="p-3">
      <h3 class="text-sm font-semibold text-gray-900 leading-tight">
        Explore Your Character
      </h3>
      <p class="text-xs text-gray-500 mt-1">
        by Ilustrasee
      </p>
    </div>
  </div>
  
  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
    <img
      src="komposisi.jpg"
      class="w-full h-28 object-cover"
      alt="Kelas"
    >
    <div class="p-3">
      <h3 class="text-sm font-semibold text-gray-900 leading-tight">
        Komposisi dan Cover Book
      </h3>
      <p class="text-xs text-gray-500 mt-1">
        by Ilustrasee
      </p>
    </div>
  </div>

</div>

<nav
  class="fixed bottom-6 left-1/2 -translate-x-1/2
         w-[80%] max-w-md
         bg-pink-300/90 backdrop-blur
         rounded-full shadow-xl
         px-4 py-3"
>
  <ul class="flex items-center justify-between">

    <!-- Beranda -->
    <li>
      <button
        onclick="setActive(this)"
        class="flex items-center gap-2 px-3 py-2 rounded-full
               bg-white text-black
               transition-all duration-300"
      >
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-sm font-medium">Beranda</span>
      </button>
    </li>

    <!-- Materi -->
    <li>
      <button
        onclick="setActive(this)"
        class="group flex items-center gap-2 px-3 py-2 rounded-full
               text-gray-600 hover:text-black
               transition-all duration-300"
      >
        <i class="fa-solid fa-book-open text-lg"></i>
        <span class="hidden group-[.active]:inline text-sm font-medium">
          Materi
        </span>
      </button>
    </li>

    <!-- Alat -->
    <li>
      <button
        onclick="setActive(this)"
        class="group flex items-center gap-2 px-3 py-2 rounded-full
               text-gray-600 hover:text-black
               transition-all duration-300"
      >
        <i class="fa-solid fa-screwdriver-wrench text-lg"></i>
        <span class="hidden group-[.active]:inline text-sm font-medium">
          Alat
        </span>
      </button>
    </li>

    <!-- Tentang -->
    <li>
      <button
        onclick="setActive(this)"
        class="group flex items-center gap-2 px-3 py-2 rounded-full
               text-gray-600 hover:text-black
               transition-all duration-300"
      >
        <i class="fa-solid fa-circle-info text-lg"></i>
        <span class="hidden group-[.active]:inline text-sm font-medium">
          Tentang
        </span>
      </button>
    </li>

  </ul>
</nav>
</main>

<script>
  
  function setActive(el) {
    document.querySelectorAll('nav button').forEach(btn => {
      btn.classList.remove('active', 'bg-white', 'text-black')
      btn.classList.add('text-gray-600')
      btn.querySelector('span')?.classList.add('hidden')
    })

    el.classList.add('active', 'bg-white', 'text-black')
    el.classList.remove('text-gray-600')
    el.querySelector('span')?.classList.remove('hidden')
  }
  
function toggleTheme() {
    const icon = document.getElementById('themeIcon')
    document.documentElement.classList.toggle('dark')

    if (icon.classList.contains('fa-moon')) {
      icon.classList.replace('fa-moon', 'fa-sun')
    } else {
      icon.classList.replace('fa-sun', 'fa-moon')
    }
  }
  </script>
</body>
</html>
