<script>

function isShortUrl(link) {
  const shortDomains = ['bit.ly', 't.co', 'tinyurl.com', 'goo.gl', 'cutt.ly'];
  return shortDomains.some(domain => link.includes(domain));
}

function isYouTube(link) {
  return link.includes('youtube.com') || link.includes('youtu.be');
}

function getYoutubeId(link) {
  if (link.includes('v=')) {
    return link.split('v=')[1].split('&')[0];
  }
  if (link.includes('youtu.be/')) {
    return link.split('youtu.be/')[1].split('?')[0];
  }
  return null;
}
  
  function setActive(el) {
    document.querySelectorAll('nav button').forEach(btn => {
      btn.classList.remove('active', 'bg-white', 'text-black')
      btn.classList.add('text-gray-600')
      btn.querySelector('span')?.classList.add('hidden')
    })

    el.classList.add('active', 'bg-white', 'text-black')
    el.classList.remove('text-gray-600')
    el.querySelector('span')?.classList.remove('hidden')
  }
  
function toggleTheme() {
    const icon = document.getElementById('themeIcon')
    document.documentElement.classList.toggle('dark')

    if (icon.classList.contains('fa-moon')) {
      icon.classList.replace('fa-moon', 'fa-sun')
    } else {
      icon.classList.replace('fa-sun', 'fa-moon')
    }
  }

function openModal(data) {
  document.getElementById('modal').classList.remove('translate-x-full');
  document.getElementById('modalTitle').textContent = data.title;
  document.getElementById('modalOrganizer').textContent = 'by ' + data.organizer;

  const list = document.getElementById('materialList');
  list.innerHTML = '';

  data.materials.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'p-4';

    row.innerHTML = `
      <button
        class="w-full flex items-center gap-3 text-left"
        onclick="toggleAccordion(this, '${item.link}')"
      >
        <span class="text-sm font-semibold text-gray-400 w-6">
          ${index + 1}.
        </span>

        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900">
            ${item.name}
          </p>
          <p class="text-xs text-gray-500 truncate">
            ${item.link}
          </p>
        </div>

        <span class="text-gray-400 transition-transform">
          ▾
        </span>
      </button>

      <div class="accordion-content hidden mt-3"></div>
    `;

    list.appendChild(row);
  });
}

function closeModal() {
  document.getElementById('modal').classList.add('translate-x-full');
}

function toggleAccordion(button, link) {
  const row = button.closest('div');
  const content = row.querySelector('.accordion-content');
  const arrow = button.querySelector('span:last-child');

  const isOpen = !content.classList.contains('hidden');

  document.querySelectorAll('.accordion-content').forEach(el => {
    if (el !== content) {
      el.classList.add('hidden');
      el.innerHTML = '';
    }
  });

  document.querySelectorAll('button span:last-child')
    .forEach(el => el.classList.remove('rotate-180'));

  if (isOpen) {
    content.classList.add('hidden');
    return;
  }

  // 🚀 short link langsung tab baru
  if (isShortUrl(link)) {
    window.open(link, '_blank');
    return;
  }

  arrow.classList.add('rotate-180');
  content.classList.remove('hidden');

  // ▶️ YouTube Shorts
  if (link.includes('youtube.com/shorts')) {
    window.open(link, '_blank');
    content.innerHTML = `
      <p class="text-sm text-gray-400">
        Shorts dibuka di YouTube ▶️
      </p>
    `;
    return;
  }

  // ▶️ YouTube normal
  if (isYouTube(link)) {
    const videoId = getYoutubeId(link);

    if (!videoId) {
      window.open(link, '_blank');
      return;
    }

    content.innerHTML = `
      <div class="w-full aspect-video max-h-[60vh] rounded-xl overflow-hidden bg-black">
        <iframe
          class="w-full h-full"
          src="https://www.youtube.com/embed/${videoId}"
          allowfullscreen>
        </iframe>
      </div>
    `;
    return;
  }

if (link.match(/\.(jpg|jpeg|png|webp)$/i)) {
  content.innerHTML = `
    <div class="w-full max-h-[70vh] flex items-center justify-center bg-black/5 rounded-xl p-3">
      <img
        src="${link}"
        alt="Preview Gambar"
        class="max-h-[65vh] w-auto object-contain rounded-lg shadow"
        loading="lazy"
      />
    </div>
  `;
  return;
}

  // 📄 PDF
  if (link.endsWith('.pdf')) {
    content.innerHTML = `
      <div class="w-full h-screen rounded-xl overflow-hidden border bg-gray-50">
        <div id="pdfViewer" class="w-full h-full overflow-y-auto p-4"></div>
      </div>
    `;
    renderPDF(link);
    return;
  }

  content.innerHTML = `
    <p class="text-sm text-gray-400">
      Preview tidak tersedia
    </p>
  `;
}

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function renderPDF(url) {
  const container = document.getElementById('pdfViewer');
  container.innerHTML = '';

  const pdf = await pdfjsLib.getDocument(url).promise;

  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);

    const viewport = page.getViewport({ scale: 1.2 }); // aman mobile
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.className = 'mx-auto rounded-lg shadow';

    await page.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;

    container.appendChild(canvas);
  }
}

    el.classList.add('hidden');
  });
  document.querySelectorAll('.accordion-content')
    .forEach(el => el.innerHTML = '');
  document.querySelectorAll('button span:last-child')
    .forEach(el => el.classList.remove('rotate-180'));

  if (isOpen) return;

  arrow.classList.add('rotate-180');
  content.classList.remove('hidden');

  // render preview
  if (link.includes('youtube.com') || link.includes('youtu.be')) {
    const id = link.includes('v=')
      ? link.split('v=')[1].split('&')[0]
      : link.split('/').pop();

    content.innerHTML = `
      <div class="w-full aspect-video max-h-[60vh] rounded-xl overflow-hidden bg-black">
        <iframe
          class="w-full h-full"
          src="https://www.youtube.com/embed/${id}"
          allowfullscreen>
        </iframe>
      </div>
    `;
  } 
  else if (link.endsWith('.pdf')) {
  content.innerHTML = `
    <div class="w-full h-screen rounded-xl overflow-hidden border bg-gray-50">
      <div id="pdfViewer" class="w-full h-full overflow-y-auto space-y-6 p-4"></div>
    </div>
  `;

  renderPDF(link);
}
  else {
    content.innerHTML = `
      <p class="text-sm text-gray-400">
        Preview tidak tersedia
      </p>
    `;
  }
}
  </script>
</body>
</html>
